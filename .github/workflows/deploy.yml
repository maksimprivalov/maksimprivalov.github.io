name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # CV: compile cv/main.tex (pdfLaTeX, needs cv/photo.jpg) -> public/cv.pdf.
      - name: Compile CV (LaTeX)
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cv
          root_file: main.tex
      - name: Publish CV PDF
        run: cp cv/main.pdf public/cv.pdf

      - name: Build site
        uses: withastro/action@v6
        with:
          node-version: 22
          build-cmd: pnpm run cv:check && pnpm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
