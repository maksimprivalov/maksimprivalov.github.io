name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # CV: compile cv/cv.tex -> public/cv.pdf (skipped until cv/cv.tex exists).
      - name: Compile CV (LaTeX)
        if: hashFiles('cv/cv.tex') != ''
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cv
          root_file: cv.tex
      - name: Publish CV PDF
        if: hashFiles('cv/cv.tex') != ''
        run: cp cv/cv.pdf public/cv.pdf

      - name: Build site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
